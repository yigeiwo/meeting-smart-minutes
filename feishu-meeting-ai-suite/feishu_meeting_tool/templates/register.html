<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册新账号 - 会议智能妙记</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root {
      --lark-blue: #3370ff;
      --lark-blue-hover: #2355d9;
      --lark-bg: #f5f6f7;
      --lark-border: #dee0e3;
    }
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #eef6ff 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
    }
    .auth-container {
      width: 100%;
      max-width: 440px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(51, 112, 255, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(222, 224, 227, 0.9);
      overflow: hidden;
      padding: 36px 32px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3370ff 0%, #1e40af 100%);
      color: #ffffff;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 8px 16px rgba(51, 112, 255, 0.25);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2329;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #8f959e;
      margin-bottom: 0;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #1f2329;
      margin-bottom: 6px;
    }
    .form-control {
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid #dee0e3;
      font-size: 14px;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: var(--lark-blue);
      box-shadow: 0 0 0 3px rgba(51, 112, 255, 0.15);
    }
    .input-group-text {
      border-radius: 8px 0 0 8px;
      border: 1px solid #dee0e3;
      border-right: none;
      background-color: #f8fafc;
      color: #8f959e;
    }
    .input-group .form-control {
      border-radius: 0 8px 8px 0;
    }
    .btn-lark {
      background-color: var(--lark-blue);
      border-color: var(--lark-blue);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      padding: 11px;
      border-radius: 8px;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-lark:hover {
      background-color: var(--lark-blue-hover);
      border-color: var(--lark-blue-hover);
      color: #fff;
      box-shadow: 0 4px 12px rgba(51, 112, 255, 0.3);
    }
    .bottom-links {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }
    .bottom-links a {
      color: var(--lark-blue);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }
    .bottom-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-icon">
        <i class="bi bi-person-plus-fill"></i>
      </div>
      <h1 class="brand-title">注册新账号</h1>
      <p class="brand-subtitle">创建您的专属会议智能总结与飞书文档管理空间</p>
    </div>

    <div id="alert-box" class="alert d-none py-2 px-3 small mb-3"></div>

    <form onsubmit="handleRegister(event)">
      <div class="mb-3">
        <label class="form-label" for="reg-username">登录账号 (用户名)</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
          <input type="text" class="form-control" id="reg-username" placeholder="至少3位字符 (字母/数字)" required minlength="3" autofocus autocomplete="username">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="reg-name">姓名 / 显示昵称</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="reg-name" placeholder="例如: 张工 / 产品经理" required autocomplete="name">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="reg-email">工作邮箱 (选填)</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="reg-email" placeholder="name@company.com" autocomplete="email">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="reg-password">登录密码</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input type="password" class="form-control" id="reg-password" placeholder="设置密码 (至少6位)" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="reg-confirm-password">确认密码</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
          <input type="password" class="form-control" id="reg-confirm-password" placeholder="请再次输入密码" required minlength="6" autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn btn-lark" id="btn-reg-submit">
        <i class="bi bi-person-plus-fill me-1"></i> 立即注册并登录
      </button>
    </form>

    <div class="bottom-links">
      <span>已有账号？</span>
      <a href="/login">立即登录 <i class="bi bi-arrow-right-short"></i></a>
    </div>
  </div>
</div>

<script>
  function showAlert(msg, isSuccess = false) {
    const box = document.getElementById('alert-box');
    box.className = `alert alert-${isSuccess ? 'success' : 'danger'} py-2 px-3 small mb-3`;
    box.innerText = msg;
    box.classList.remove('d-none');
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-reg-submit');
    const username = document.getElementById('reg-username').value.trim();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirmPwd = document.getElementById('reg-confirm-password').value;

    if (password !== confirmPwd) {
      showAlert('两次输入的密码不一致，请核对后重试');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 正在创建账号...';

    try {
      const resp = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: username,
          password: password,
          display_name: name,
          email: email
        })
      });
      const res = await resp.json();
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-person-plus-fill me-1"></i> 立即注册并登录';

      if (res.code === 0) {
        document.cookie = `session_token=${res.token}; path=/; max-age=604800`;
        localStorage.setItem('auth_token', res.token);
        localStorage.setItem('auth_user', JSON.stringify(res.user));
        showAlert(`🎉 注册成功！欢迎加入，${res.user.display_name}！正在进入工作台...`, true);
        setTimeout(() => {
          window.location.href = '/';
        }, 600);
      } else {
        showAlert(res.msg || '注册失败');
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-person-plus-fill me-1"></i> 立即注册并登录';
      showAlert('网络异常: ' + err);
    }
  }
</script>
</body>
</html>
