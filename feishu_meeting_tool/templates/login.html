<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户登录 - 会议智能妙记</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    :root {
      --lark-blue: #3370ff;
      --lark-blue-hover: #2355d9;
      --lark-bg: #f5f6f7;
      --lark-border: #dee0e3;
    }
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #f8fafc 50%, #eef6ff 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
    }
    .auth-container {
      width: 100%;
      max-width: 420px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(51, 112, 255, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(222, 224, 227, 0.9);
      overflow: hidden;
      padding: 36px 32px;
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #3370ff 0%, #1e40af 100%);
      color: #ffffff;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 8px 16px rgba(51, 112, 255, 0.25);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 700;
      color: #1f2329;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #8f959e;
      margin-bottom: 0;
    }
    .form-label {
      font-size: 13px;
      font-weight: 600;
      color: #1f2329;
      margin-bottom: 6px;
    }
    .form-control {
      border-radius: 8px;
      padding: 10px 14px;
      border: 1px solid #dee0e3;
      font-size: 14px;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: var(--lark-blue);
      box-shadow: 0 0 0 3px rgba(51, 112, 255, 0.15);
    }
    .input-group-text {
      border-radius: 8px 0 0 8px;
      border: 1px solid #dee0e3;
      border-right: none;
      background-color: #f8fafc;
      color: #8f959e;
    }
    .input-group .form-control {
      border-radius: 0 8px 8px 0;
    }
    .input-group .btn-eye {
      border-radius: 0 8px 8px 0;
      border: 1px solid #dee0e3;
      border-left: none;
      background-color: #f8fafc;
      color: #8f959e;
    }
    .input-group .btn-eye:hover {
      background-color: #f1f5f9;
      color: #1f2329;
    }
    .btn-lark {
      background-color: var(--lark-blue);
      border-color: var(--lark-blue);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      padding: 11px;
      border-radius: 8px;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-lark:hover {
      background-color: var(--lark-blue-hover);
      border-color: var(--lark-blue-hover);
      color: #fff;
      box-shadow: 0 4px 12px rgba(51, 112, 255, 0.3);
    }
    .bottom-links {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }
    .bottom-links a {
      color: var(--lark-blue);
      text-decoration: none;
      font-weight: 600;
      margin-left: 4px;
    }
    .bottom-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-icon">
        <i class="bi bi-file-earmark-easel-fill"></i>
      </div>
      <h1 class="brand-title">会议智能妙记智能妙记</h1>
      <p class="brand-subtitle">账号登录 · 会议纪要与飞书文档智能生成系统</p>
    </div>

    <div id="alert-box" class="alert d-none py-2 px-3 small mb-3"></div>

    <form onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label class="form-label" for="login-username">用户名 / 账号</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="login-username" placeholder="请输入用户名" required autofocus autocomplete="username">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="login-password">密码</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="login-password" placeholder="请输入登录密码" required autocomplete="current-password">
          <button class="btn btn-eye" type="button" onclick="togglePasswordVisibility('login-password')">
            <i class="bi bi-eye" id="login-password-eye"></i>
          </button>
        </div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember-me" checked>
          <label class="form-check-label small text-muted" for="remember-me">记住登录状态 (7天)</label>
        </div>
      </div>

      <button type="submit" class="btn btn-lark" id="btn-login-submit">
        <i class="bi bi-box-arrow-in-right me-1"></i> 登 录
      </button>
    </form>

    <div class="bottom-links">
      <span>还没有账号？</span>
      <a href="/register">立即注册新账号 <i class="bi bi-arrow-right-short"></i></a>
    </div>
  </div>
</div>

<script>
  function showAlert(msg, isSuccess = false) {
    const box = document.getElementById('alert-box');
    box.className = `alert alert-${isSuccess ? 'success' : 'danger'} py-2 px-3 small mb-3`;
    box.innerText = msg;
    box.classList.remove('d-none');
  }

  function togglePasswordVisibility(inputId) {
    const input = document.getElementById(inputId);
    const eye = document.getElementById(inputId + '-eye');
    if (input.type === 'password') {
      input.type = 'text';
      if (eye) eye.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      if (eye) eye.className = 'bi bi-eye';
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-login-submit');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 正在登录...';

    try {
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const res = await resp.json();
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> 登 录';

      if (res.code === 0) {
        document.cookie = `session_token=${res.token}; path=/; max-age=604800`;
        localStorage.setItem('auth_token', res.token);
        localStorage.setItem('auth_user', JSON.stringify(res.user));
        showAlert(`🎉 登录成功，欢迎回来 ${res.user.display_name}！正在进入工作台...`, true);
        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      } else {
        showAlert(res.msg || '用户名或密码错误，请核对后重试');
      }
    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> 登 录';
      showAlert('网络连接异常: ' + err);
    }
  }
</script>
</body>
</html>
