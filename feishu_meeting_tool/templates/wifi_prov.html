<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 胸卡无线配网助手</title>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --success: #10B981;
            --warning: #F59E0B;
            --error: #EF4444;
            --bg: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif; }
        body { background: var(--bg); color: var(--text-main); min-height: 100vh; padding: 20px 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 440px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        .logo-badge { display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); color: #fff; font-size: 28px; margin-bottom: 12px; box-shadow: 0 8px 16px rgba(59, 130, 246, 0.25); }
        .title { font-size: 20px; font-weight: 700; color: var(--text-main); margin-bottom: 6px; }
        .subtitle { font-size: 13px; color: var(--text-muted); }

        .card { background: var(--card-bg); border-radius: 20px; padding: 22px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border); margin-bottom: 18px; }
        
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .form-control { width: 100%; height: 46px; border: 1.5px solid var(--border); border-radius: 12px; padding: 0 14px; font-size: 15px; outline: none; transition: border-color 0.2s; background: #FAFAFA; }
        .form-control:focus { border-color: var(--primary); background: #FFF; }
        
        .btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 48px; border-radius: 14px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; transition: all 0.2s; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .status-box { margin-top: 18px; padding: 14px; border-radius: 12px; font-size: 13px; display: none; line-height: 1.5; text-align: center; }
        .status-loading { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; display: block; }
        .status-success { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; display: block; }
        .status-error { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; display: block; }

        .nfc-tip { background: #F8FAFC; border: 1px dashed #CBD5E1; border-radius: 16px; padding: 16px; margin-top: 10px; font-size: 13px; color: #475569; }
        .nfc-tip h4 { font-size: 14px; font-weight: 700; color: #1E293B; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
        .nfc-tip ol { padding-left: 20px; line-height: 1.8; }
        .nfc-tip code { background: #E2E8F0; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #0F172A; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-badge">⚡</div>
            <h1 class="title">飞书智能胸卡配网助手</h1>
            <p class="subtitle">手机 NFC 碰一碰调起 · BLE 蓝牙一键同步</p>
        </div>

        <div class="card">
            <div class="form-group">
                <label class="form-label">无线网络名称 (Wi-Fi SSID)</label>
                <input type="text" id="ssidInput" class="form-control" placeholder="例如: Home-WiFi (仅支持 2.4GHz)">
            </div>

            <div class="form-group">
                <label class="form-label">无线网络密码 (Password)</label>
                <input type="password" id="pwdInput" class="form-control" placeholder="请输入 Wi-Fi 密码 (无密码留空)">
            </div>

            <button id="pairBtn" class="btn btn-primary" onclick="startBlePairing()">
                <span>🔍 蓝牙连接胸卡并同步 Wi-Fi</span>
            </button>

            <div id="statusBox" class="status-box"></div>
        </div>

        <div class="nfc-tip">
            <h4><span>🏷️</span> 手机 NFC 碰一碰配置教程</h4>
            <ol>
                <li>手机下载免费 App <b>NFC Tools</b> (各大应用商店均有免费下载)；</li>
                <li>打开 NFC Tools &gt; 点击<b>【写】</b> &gt; 点击<b>【添加记录】</b>；</li>
                <li>选择<b>【网址 / URL】</b>，输入当前网址：<br><code id="curUrlText"></code></li>
                <li>点击<b>【写入】</b>并将手机背面贴近胸卡背面的 NFC 区域；</li>
                <li>手机提示写入成功后，以后拿手机碰一下胸卡背面，就会自动弹出本配网页面！</li>
            </ol>
        </div>
    </div>

    <script>
        document.getElementById('curUrlText').innerText = window.location.href;

        const BLE_SERVICE_UUID = 0xFFF0;
        const CHAR_WRITE_UUID  = 0xFFF1;
        const CHAR_NOTIFY_UUID = 0xFFF2;

        function showStatus(msg, type) {
            const box = document.getElementById('statusBox');
            box.className = 'status-box status-' + type;
            box.innerHTML = msg;
            box.style.display = 'block';
        }

        async function startBlePairing() {
            const ssid = document.getElementById('ssidInput').value.trim();
            const pwd  = document.getElementById('pwdInput').value;
            const btn  = document.getElementById('pairBtn');

            if (!ssid) {
                alert('请输入 Wi-Fi 名称 (SSID)');
                return;
            }

            if (!navigator.bluetooth) {
                showStatus('⚠️ 提示: 当前手机浏览器未开放 Web Bluetooth 接口。<br><b>建议:</b> 安卓请使用 Chrome/Edge 浏览器；iPhone 请使用免费的 Bluefy 浏览器。', 'error');
                return;
            }

            try {
                btn.disabled = true;
                showStatus('正在搜索胸卡蓝牙 (FoloPassport)...<br>请在弹出的蓝牙列表中选择设备', 'loading');

                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'FoloPassport' }],
                    optionalServices: [BLE_SERVICE_UUID]
                });

                showStatus('正在与胸卡建立蓝牙加密握手...', 'loading');
                const server = await device.gatt.connect();

                showStatus('正在获取配网服务...', 'loading');
                const service = await server.getPrimaryService(BLE_SERVICE_UUID);

                const writeChar = await service.getCharacteristic(CHAR_WRITE_UUID);
                const notifyChar = await service.getCharacteristic(CHAR_NOTIFY_UUID);

                // 监听连接状态反馈
                await notifyChar.startNotifications();
                notifyChar.addEventListener('characteristicvaluechanged', (event) => {
                    const val = new TextDecoder().decode(event.target.value);
                    console.log('BLE Notify:', val);
                    try {
                        const data = JSON.parse(val);
                        if (data.status === 1) {
                            showStatus('⏳ 胸卡正在连接路由器: ' + ssid + '...', 'loading');
                        } else if (data.status === 2) {
                            showStatus('🎉 <b>配网大功告成！</b><br>胸卡已成功连上网络，获取真实 IP:<br><b style="font-size:16px;color:#059669;">' + data.ip + '</b>', 'success');
                            btn.disabled = false;
                        } else if (data.status === 3) {
                            showStatus('❌ 胸卡连接 Wi-Fi 失败，请检查密码是否正确！', 'error');
                            btn.disabled = false;
                        }
                    } catch (e) {
                        showStatus('接收状态: ' + val, 'loading');
                    }
                });

                showStatus('正在将 Wi-Fi 凭证同步给胸卡...', 'loading');
                const payload = JSON.stringify({ ssid: ssid, pwd: pwd });
                const encoder = new TextEncoder();
                await writeChar.writeValueWithResponse(encoder.encode(payload));

                showStatus('Wi-Fi 凭据已写入胸卡，等待胸卡接入网络...', 'loading');

            } catch (err) {
                console.error(err);
                btn.disabled = false;
                if (err.name === 'NotFoundError') {
                    showStatus('已取消蓝牙配对', 'error');
                } else {
                    showStatus('蓝牙通信异常: ' + err.message, 'error');
                }
            }
        }
    </script>
</body>
</html>
