name: Build AI Passport Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Build AI Passport ESP32-C3 Firmware (.bin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware using ESP-IDF v5.5.3 Container
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            cd ai-passport
            chmod +x tools/validate.sh
            set +e
            ./tools/validate.sh --firmware > /tmp/idf.log 2>&1
            rc=$?
            tail -n 150 /tmp/idf.log
            cp -f /tmp/idf.log ./idf_build.log 2>/dev/null
            cp -f /tmp/idf.log /github/workspace/idf_build.log 2>/dev/null
            exit $rc

      - name: Ensure build log available
        if: always()
        run: |
          if [ ! -f idf_build.log ]; then
            cp ai-passport/idf_build.log idf_build.log 2>/dev/null || echo "CI 未捕获到编译日志" > idf_build.log
          fi
          echo "日志大小: $(wc -c < idf_build.log) 字节"

      # 失败时把编译日志发布成公开可下载的 Release 资源, 便于无人值守时定位问题。
      # 排查完可以删掉这一步(以及上一步)。
      - name: Publish build log as Release asset (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: "Build Log (latest failure)"
          prerelease: true
          files: idf_build.log

      - name: Copy firmware to root release folder
        run: |
          mkdir -p release_bin
          cp ai-passport/build/FoloToy-AI-Passport-full.bin release_bin/FoloToy-AI-Passport-full.bin
          cp ai-passport/build/FoloToy-AI-Passport-full.bin release_bin/Feishu-Meeting-Passport-full.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoloToy-AI-Passport-Firmware-bin
          path: release_bin/
          if-no-files-found: error

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }} AI Passport 固件"
          files: release_bin/*
          draft: false
          prerelease: false
