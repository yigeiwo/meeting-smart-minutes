name: Build AI Passport Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-firmware:
    name: Build AI Passport ESP32-C3 Firmware (.bin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware using ESP-IDF v5.5.3 Container
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            cd ai-passport
            chmod +x tools/validate.sh
            ./tools/validate.sh --firmware

      - name: Copy firmware to root release folder
        run: |
          mkdir -p release_bin
          cp ai-passport/build/FoloToy-AI-Passport-full.bin release_bin/FoloToy-AI-Passport-full.bin
          cp ai-passport/build/FoloToy-AI-Passport-full.bin release_bin/Feishu-Meeting-Passport-full.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoloToy-AI-Passport-Firmware-bin
          path: release_bin/
          if-no-files-found: error

      - name: Publish GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }} AI Passport 固件"
          files: release_bin/*
          draft: false
          prerelease: false
